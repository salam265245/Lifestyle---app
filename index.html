        self.addEventListener('install', e=>{
          self.skipWaiting();
          e.waitUntil(caches.open(CACHE).then(c=>c.addAll(OFFLINE_URLS).catch(()=>{})));

function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,8); }
function today(){ 
  const d = new Date();
  const yyyy = d.getFullYear();
  const mm = String(d.getMonth()+1).padStart(2,'0');
  const dd = String(d.getDate()).padStart(2,'0');
  return `${yyyy}-${mm}-${dd}`; 
}
function thisMonth(){ 
  const d = new Date();
  const yyyy = d.getFullYear();
  const mm = String(d.getMonth()+1).padStart(2,'0');
  return `${yyyy}-${mm}`; 
}
function nowTimeStr(){
  return new Date().toLocaleTimeString('bn-BD', {hour:'2-digit', minute:'2-digit', second:'2-digit'});
}

function addMonths(dateStr, n){ const d = new Date(dateStr); d.setMonth(d.getMonth()+n); return d.toISOString().slice(0,10); }
function fmtMoney(n){ n = Math.round(n||0); return '\u09F3 ' + n.toLocaleString('en-US'); }
function calcEMI(principal, ratePct, months){
  if(!months) return 0;
  if(!ratePct) return Math.ceil(principal/months);
  const r = ratePct/12/100;
  const pow = Math.pow(1+r, months);
  const raw = principal*r*pow/(pow-1);
  return Math.ceil(raw);
}

/* ---------- migration from old data format ---------- */
function migrateOldPeople(oldArr){
  const map = new Map();
  (oldArr||[]).forEach(entry=>{
    const key = (entry.name||'').trim().toLowerCase() || uid();
    if(!map.has(key)){
      map.set(key, { id: uid(), name: entry.name||'', mobile: entry.mobile||'', loans:[], payments:[] });
    }
    const person = map.get(key);
    person.loans.push({
      id: entry.id || uid(),
      amount: entry.totalAmount || 0,
      date: entry.dateTaken || today(),
      medium: entry.medium || 'Cash',
      note: entry.note || ''
    });
    (entry.payments||[]).forEach(p=>{
      person.payments.push({ id: uid(), amount: p.amount||0, date: p.date || today(), method: 'Cash', note: p.type||'' });
    });
  });
  return Array.from(map.values());
}

function loadInitialState(){
  let transactions = loadLS('lifestyle_transactions', null);
  let peopleGiven = loadLS('lifestyle_people_given', null);
  let peopleTaken = loadLS('lifestyle_people_taken', null);
  let bankLoans = loadLS('lifestyle_bank_loans', null);

  if(transactions === null){
    transactions = loadLS('lifestyle_v3_transactions', []);
  }
  if(peopleGiven === null){
    const old = loadLS('lifestyle_v3_loansGiven', []);
    peopleGiven = migrateOldPeople(old);
  }
  if(peopleTaken === null){
    const old = loadLS('lifestyle_v3_loansTaken', []);
    peopleTaken = migrateOldPeople(old);
  }
  if(bankLoans === null){
    const old = loadLS('lifestyle_v3_bankLoans', []);
    bankLoans = (old||[]).map(l=>({
      id: l.id || uid(), bankName: l.bankName||'', amount: l.amount||0,
      termMonths: l.termMonths||12, interestRate: l.interestRate||0, loanDate: l.loanDate || today()
    }));
  }
  return {
    transactions: transactions || [],
    peopleGiven: peopleGiven || [],
    peopleTaken: peopleTaken || [],
    bankLoans: bankLoans || []
  };
}

/* ---------- Category Picker ---------- */
function CategoryPicker({ t, lang, type, value, onChange }){
  const [q, setQ] = useState('');
  const flat = useMemo(()=>{
    if(type === 'income') return INCOME_CATEGORIES;
    return EXPENSE_CATEGORIES.flatMap(g => g.items.map(it => Object.assign({}, it, {group: g.en})));
  }, [type]);
  const filtered = useMemo(()=>{
    if(!q) return flat;
    const ql = q.toLowerCase();
    return flat.filter(a => (a.en && a.en.toLowerCase().includes(ql)) || (a.bn && a.bn.includes(q)));
  }, [flat, q]);
  return h('div', null,
    h('input', {
      value: q, onChange: e=>setQ(e.target.value),
      placeholder: t.selectCategory + '...',
      className:'w-full bg-white rounded-full border border-[#F3E8D3] px-4 py-2.5 outline-none text-[13px] mb-2'
    }),
    h('div', {className:'grid grid-cols-2 gap-2 max-h-[220px] overflow-y-auto p-1'},
      filtered.map((a,i)=> h('button', {
        key: a.en+i, type:'button',
        onClick: ()=>onChange(a),
        className: 'flex items-center gap-2 p-3 rounded-[14px] border text-left ' + (value && value.en===a.en ? 'bg-[#2D2A26] text-white border-[#2D2A26]' : 'bg-white border-[#F3E8D3]')
      },
        h('span', {className:'text-[16px]'}, a.icon),
        h('span', {className:'text-[12px] font-medium leading-tight'}, lang==='en'?a.en:a.bn)
      ))
    )
  );
}

  const [cat, setCat] = useState(initial ? {en:initial.category, bn:initial.categoryBn} : null);
  const [date, setDate] = useState(initial ? initial.date : today());
  const [note, setNote] = useState(initial ? initial.note : '');

/* ---------- Bank loan form ---------- */
function BankLoanForm({ t, lang, initial, onSave }){
  const [bankName, setBankName] = useState(initial ? initial.bankName : BANKS[0]);
  const [amount, setAmount] = useState(initial ? String(initial.amount) : '');
  const [term, setTerm] = useState(initial ? String(initial.termMonths) : '24');
  const [rate, setRate] = useState(initial ? String(initial.interestRate) : '9');
  const [disbursementDate, setDisbursementDate] = useState(initial ? (initial.disbursementDate || initial.loanDate || today()) : today());
  const [emiStartDate, setEmiStartDate] = useState(initial ? (initial.emiStartDate || initial.loanDate || today()) : today());
  const [paidEmis, setPaidEmis] = useState(initial && initial.paidEmis ? initial.paidEmis.slice() : []);
  const emi = calcEMI(parseFloat(amount)||0, parseFloat(rate)||0, parseInt(term)||1);
  const emiEndDate = useMemo(()=>{
    const n = parseInt(term)||1;
    return emiStartDate ? addMonths(emiStartDate, n-1) : '';
  }, [emiStartDate, term]);
  function togglePaid(i){
    setPaidEmis(prev=>{
      const next = prev.slice();
      while(next.length < (parseInt(term)||1)) next.push(false);
      next[i] = !next[i];
      return next;
    });
  }
  function submit(){
    if(!amount || !term) return;
    const n = parseInt(term)||1;
    let p = paidEmis.slice();
    if(p.length !== n){
      const resized = Array(n).fill(false);
      for(let i=0;i<Math.min(n, p.length);i++) resized[i] = p[i];
      p = resized;
    }
    onSave({
      id: initial?initial.id:uid(), bankName, amount:parseFloat(amount)||0, termMonths:n,
      interestRate:parseFloat(rate)||0, loanDate: disbursementDate,
      disbursementDate, emiStartDate, emiEndDate, paidEmis: p
    });
  }
  const n = parseInt(term)||24;
  const rows = [];
  for(let i=0;i<n;i++){
    const d = new Date(emiStartDate);
    d.setMonth(d.getMonth()+i);
    const ds = d.toISOString().split('T')[0];
    rows.push({ idx:i, date: ds, paid: !!(paidEmis[i]) });
  }
  return h('div', null,
    h('div', {className:'sticky top-0 z-20 bg-[#FFFBF7] -mx-5 -mt-5 px-5 py-3 border-b border-[#F3E8D3] flex gap-2'},
      h('button', {onClick:submit, disabled: !amount || !term, className:'flex-1 py-3.5 rounded-[14px] font-bold text-[15px] bg-[#2D2A26] text-white disabled:opacity-40'}, t.saveLoan),
      h('button', {type:'button', className:'px-5 py-3.5 rounded-[14px] font-bold text-[14px] bg-white border border-[#F3E8D3]'}, t.cancel)
    ),
    h('div', {className:'pt-4'},
      h(Field, {label:t.bankName}, h(Select, {value:bankName, onChange:e=>setBankName(e.target.value)},
        BANKS.map(b=>h('option', {key:b, value:b}, b))
      )),
      h('div', {className:'grid grid-cols-2 gap-3'},
        h(Field, {label:t.loanAmount}, h(TextInput, {type:'number', value:amount, onChange:e=>setAmount(e.target.value)})),
        h(Field, {label:t.termMonths}, h(TextInput, {type:'number', value:term, onChange:e=>setTerm(e.target.value)}))
      ),
      h(Field, {label:t.interestRate}, h(TextInput, {type:'number', step:'0.1', value:rate, onChange:e=>setRate(e.target.value)})),
      h('div', {className:'grid grid-cols-2 gap-3'},
        h(Field, {label:t.disbursementDate}, h(TextInput, {type:'date', value:disbursementDate, onChange:e=>setDisbursementDate(e.target.value)})),
        h(Field, {label:t.emiStartDate}, h(TextInput, {type:'date', value:emiStartDate, onChange:e=>setEmiStartDate(e.target.value)}))
      ),
      h(Field, {label:t.emiEndDate}, h(TextInput, {type:'date', value:emiEndDate, disabled:true, className:'w-full bg-[#F3E8D3]/40 border border-[#F3E8D3] rounded-[14px] px-4 py-3 text-[14px] outline-none text-[#8B7355]'})),

      amount && term ? h('div', {className:'bg-[#2D2A26] rounded-[16px] p-4 text-white mb-3 flex justify-between'},
        h('span', {className:'text-[12px] text-white/70'}, 'EMI'),
        h('span', {className:'font-bold'}, fmtMoney(emi))
      ) : null,

      h('div', {className:'mt-4'},
        h('div', {className:'flex items-center justify-between mb-2'},
          h('p', {className:'font-bold text-[13px]'}, lang==='bn'?'EMI শিট (Excel আকারে)':'EMI Sheet'),
          h('p', {className:'text-[11px] text-[#8B7355]'}, (paidEmis.filter(Boolean).length||0) + '/' + n + ' Paid')
        ),
        h('div', {className:'bg-white rounded-[14px] border border-[#F3E8D3] overflow-hidden'},
          h('div', {className:'overflow-x-auto'},
            h('table', {className:'w-full text-[12px]'},
              h('thead', {className:'bg-[#F9F5EB]'},
                h('tr', null,
                  h('th', {className:'px-3 py-2.5 text-left font-bold border-r border-[#F3E8D3]'}, 'SL No'),
                  h('th', {className:'px-3 py-2.5 text-left font-bold border-r border-[#F3E8D3]'}, lang==='bn'?'তারিখ':'Date'),
                  h('th', {className:'px-3 py-2.5 text-left font-bold border-r border-[#F3E8D3]'}, 'EMI'),
                  h('th', {className:'px-3 py-2.5 text-center font-bold'}, lang==='bn'?'পরিশোধ':'Paid')
                )
              ),
              h('tbody', null,
                rows.map(r => h('tr', {
                  key:r.idx,
                  className: 'border-t border-[#F3E8D3] ' + (r.paid ? 'bg-[#E8F5E9]' : 'bg-[#FFEBEE]')
                },
                  h('td', {className:'px-3 py-2.5 border-r border-[#F3E8D3]'}, r.idx+1),
                  h('td', {className:'px-3 py-2.5 border-r border-[#F3E8D3]'}, r.date),
                  h('td', {className:'px-3 py-2.5 border-r border-[#F3E8D3] font-semibold'}, fmtMoney(emi)),
                  h('td', {className:'px-3 py-2.5 text-center'},
                    h('button', {
                      type:'button',
                      onClick:()=>togglePaid(r.idx),
                      className:'w-7 h-7 rounded-[6px] border-2 flex items-center justify-center text-[14px] font-bold mx-auto ' + (r.paid ? 'bg-[#4CAF50] border-[#4CAF50] text-white' : 'bg-white border-[#FFCDD2] text-[#B71C1C]')
                    }, r.paid ? '✓' : '☐')
                  )
                ))
              )
            )
          )
        )
      )
    )
  );
}

function PersonDetail({ t, lang, kind, person, onBack, onUpdatePerson, onDeletePerson }){
  const [addingLoan, setAddingLoan] = useState(false);
  const [addingPayment, setAddingPayment] = useState(false);
  const [editingLoan, setEditingLoan] = useState(null);
  const [editingPayment, setEditingPayment] = useState(null);
  const [confirmDel, setConfirmDel] = useState(null); // {kind:'loan'|'payment'|'person', id}

  const totalLoaned = person.loans.reduce((a,l)=>a+l.amount,0);
  const totalPaid = person.payments.reduce((a,p)=>a+p.amount,0);
  const balance = totalLoaned - totalPaid;

  function saveLoan(loan){
    const loans = editingLoan
      ? person.loans.map(l => l.id === loan.id ? loan : l)
      : [loan, ...person.loans];
    onUpdatePerson(Object.assign({}, person, {loans}));
    setAddingLoan(false); setEditingLoan(null);
  }
  function savePayment(p){
    const payments = editingPayment
      ? person.payments.map(x => x.id === p.id ? p : x)
      : [p, ...person.payments];
    onUpdatePerson(Object.assign({}, person, {payments}));
    setAddingPayment(false); setEditingPayment(null);
  }
  function doDelete(){
    if(!confirmDel) return;
    if(confirmDel.kind === 'loan'){
      onUpdatePerson(Object.assign({}, person, {loans: person.loans.filter(l=>l.id!==confirmDel.id)}));
    } else if(confirmDel.kind === 'payment'){
      onUpdatePerson(Object.assign({}, person, {payments: person.payments.filter(p=>p.id!==confirmDel.id)}));
    } else if(confirmDel.kind === 'person'){
      onDeletePerson(person.id);
    }
    setConfirmDel(null);
  }

  const balanceLabel = kind === 'given' ? t.youWillGet : t.youOwe;

  return h('div', {className:'pt-5 pb-6 space-y-4'},
    h('div', {className:'flex items-center gap-2'},
      h(IconBtn, {onClick:onBack}, '\u2190'),
      h('h2', {className:'text-[18px] font-bold flex-1'}, person.name),

      h('p', {className:'text-[12px] text-white/70'}, balanceLabel),
      h('p', {className:'text-[24px] font-bold mt-1'}, fmtMoney(balance)),
      h('div', {className:'flex justify-between text-[11px] text-white/60 mt-2'},
        h('span', null, t.total + ': ' + fmtMoney(totalLoaned)),
        h('span', null, (kind==='given'?t.totalReturned:t.totalRepaid) + ': ' + fmtMoney(totalPaid))
      ),
      h('button', {onClick: async ()=>{
        try{
          const blob = buildPersonLoanPdfBlob({t, lang, person, kind});
          await shareOrDownloadPdf(blob, person.name + '-loan-history.pdf', person.name + ' Loan History');
        }catch(e){ alert('PDF Error'); }

    ),
    h('div', null,
      h('div', {className:'flex items-center justify-between mb-2'},
        h('h3', {className:'font-bold text-[14px]'}, t.loanHistory),
        h('button', {onClick:()=>setAddingLoan(true), className:'text-[12px] font-bold text-[#C9A86A]'}, t.addLoan)

/* ---------- PDF report (renders pages on canvas -> JPEG -> minimal PDF) ---------- */
const PDF_FONT = "'Noto Sans Bengali','Hind Siliguri','Nirmala UI','Kalpurush',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif";

function renderReportPages(o){
  const t = o.t, from = o.from, to = o.to;
  const W = 1240, H = 1754, M = 70;
  const pages = []; let cv, ctx, y = 0;
  const cDate = {x:M, w:170}, cMid = {x:M+185, w:280}, cNote = {x:M+480, w:400}, cAmt = {x:W-M-230, w:230};
  function newPage(){
    cv = document.createElement('canvas'); cv.width = W; cv.height = H;
    ctx = cv.getContext('2d'); ctx.fillStyle = '#ffffff'; ctx.fillRect(0,0,W,H);
    pages.push(cv); y = M;
  }
  function font(sz, bold){ ctx.font = (bold ? '700 ' : '400 ') + sz + 'px ' + PDF_FONT; }
  function fit(str, maxW){
    str = String(str == null ? '' : str);
    if(!maxW || ctx.measureText(str).width <= maxW) return str;
    while(str.length > 1 && ctx.measureText(str + '\u2026').width > maxW) str = str.slice(0,-1);
    return str + '\u2026';
  }
  function txt(str, x, size, bold, color, align, maxW){
    font(size, bold); ctx.fillStyle = color || '#2D2A26'; ctx.textAlign = align || 'left';
    ctx.fillText(fit(str, maxW), x, y);
  }
  function ensure(hh){ if(y + hh > H - M - 30) newPage(); }
  function line(color){ ctx.strokeStyle = color || '#F3E8D3'; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(M, y); ctx.lineTo(W-M, y); ctx.stroke(); }
  function heading(str, color){
    ensure(110); y += 30; txt(str, M, 32, true, color || '#2D2A26'); y += 16; line('#C9A86A'); y += 36;
  }
  function row(cells, size, bold, color){
    ensure(46);
    cells.forEach(c => {
      const right = c.align === 'right';
      txt(c.t, right ? c.x + c.w : c.x, size || 24, bold, c.color || color, right ? 'right' : 'left', c.w);
    });
    y += 44;
  }
  function muted(str){ ensure(46); txt(str, M, 22, false, '#8B7355'); y += 44; }
  function inRange(d){ return d && d >= from && d <= to; }
  const money = fmtMoney;

  newPage();
  txt(t.appName + ' \u2022 ' + t.reportHeading, M, 44, true); y += 48;
  if(o.userName){ txt(o.userName, M, 28, true, '#8B6B3A'); y += 40; }
  txt(t.period + ': ' + from + '  \u2192  ' + to, M, 24, false, '#8B7355'); y += 36;
  txt(t.generated + ': ' + today(), M, 22, false, '#8B7355'); y += 20;

  // income / expense
  const tx = o.transactions.filter(x => inRange(x.date)).sort((a,b) => a.date.localeCompare(b.date));
  const inc = tx.filter(x => x.type === 'income'), exp = tx.filter(x => x.type === 'expense');

function buildPdfFromJpegs(jpegs){
  const enc = new TextEncoder(), chunks = [], offsets = [];
  let len = 0;
  function push(x){ const b = typeof x === 'string' ? enc.encode(x) : x; chunks.push(b); len += b.length; }
  const n = jpegs.length, total = 2 + 3*n;
  push('%PDF-1.4\n');
  offsets[1] = len; push('1 0 obj\n<< /Type /Catalog /Pages 2 0 R >>\nendobj\n');
  const kids = []; for(let i=0;i<n;i++) kids.push((3+i*3)+' 0 R');
  offsets[2] = len; push('2 0 obj\n<< /Type /Pages /Kids [' + kids.join(' ') + '] /Count ' + n + ' >>\nendobj\n');
  for(let i=0;i<n;i++){
    const pg = 3+i*3, ct = pg+1, im = pg+2, j = jpegs[i];
    offsets[pg] = len;
    push(pg + ' 0 obj\n<< /Type /Page /Parent 2 0 R /MediaBox [0 0 595 842] /Resources << /XObject << /Im0 ' + im + ' 0 R >> >> /Contents ' + ct + ' 0 R >>\nendobj\n');
    const content = 'q 595 0 0 842 0 0 cm /Im0 Do Q';
    offsets[ct] = len;
    push(ct + ' 0 obj\n<< /Length ' + content.length + ' >>\nstream\n' + content + '\nendstream\nendobj\n');
    offsets[im] = len;
    push(im + ' 0 obj\n<< /Type /XObject /Subtype /Image /Width ' + j.w + ' /Height ' + j.h + ' /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length ' + j.bytes.length + ' >>\nstream\n');
    push(j.bytes); push('\nendstream\nendobj\n');
  }
  const xref = len;
  let x = 'xref\n0 ' + (total+1) + '\n0000000000 65535 f \n';
  for(let i=1;i<=total;i++) x += String(offsets[i]).padStart(10,'0') + ' 00000 n \n';
  push(x + 'trailer\n<< /Size ' + (total+1) + ' /Root 1 0 R >>\nstartxref\n' + xref + '\n%%EOF');
  return new Blob(chunks, {type:'application/pdf'});
}


function renderPersonLoanPages(o){
  const t=o.t, person=o.person, kind=o.kind;

  const cDate={x:M,w:170}, cMid={x:M+185,w:320}, cNote={x:M+520,w:360}, cAmt={x:W-M-230,w:230};
  function newPage(){ cv=document.createElement('canvas'); cv.width=W; cv.height=H; ctx=cv.getContext('2d'); ctx.fillStyle='#fff'; ctx.fillRect(0,0,W,H); pages.push(cv); y=M; }
  function font(sz,bold){ ctx.font=(bold?'700 ':'400 ')+sz+'px '+PDF_FONT; }
  function fit(str,maxW){ str=String(str==null?'':str); if(!maxW||ctx.measureText(str).width<=maxW) return str; while(str.length>1&&ctx.measureText(str+'…').width>maxW) str=str.slice(0,-1); return str+'…'; }
  function txt(str,x,size,bold,color,align,maxW){ font(size,bold); ctx.fillStyle=color||'#2D2A26'; ctx.textAlign=align||'left'; ctx.fillText(fit(str,maxW),x,y); }
  function ensure(hh){ if(y+hh>H-M-30) newPage(); }
  function line(c){ ctx.strokeStyle=c||'#F3E8D3'; ctx.lineWidth=2; ctx.beginPath(); ctx.moveTo(M,y); ctx.lineTo(W-M,y); ctx.stroke(); }

function buildPersonLoanPdfBlob(o){
  const pages=renderPersonLoanPages(o);
  const jpegs=pages.map(c=>{
    const b64=c.toDataURL('image/jpeg',0.92).split(',')[1];
    const bin=atob(b64), bytes=new Uint8Array(bin.length);
    for(let i=0;i<bin.length;i++) bytes[i]=bin.charCodeAt(i);
    return {bytes,w:c.width,h:c.height};
  });
  return buildPdfFromJpegs(jpegs);
}

function buildReportPdfBlob(o){
  const pages = renderReportPages(o);

    for(let i=0;i<bin.length;i++) bytes[i] = bin.charCodeAt(i);
    return {bytes, w:c.width, h:c.height};
  });
  return buildPdfFromJpegs(jpegs);
}

async function shareOrDownloadPdf(blob, filename, title){
  // 1. Try native share (works best on mobile Chrome)
  try{
    const file = new File([blob], filename, {type:'application/pdf'});
    if(navigator.canShare && navigator.canShare({files:[file]})){
      try{ await navigator.share({files:[file], title}); return 'shared'; }
      catch(e){ if(e && e.name === 'AbortError') return 'cancelled'; }
    }
  }catch(e){}
  
  // 2. Try to convert to dataURL for WebView (AppsGeyser fix)
  const isWebView = /wv|WebView|Android.*Version/.test(navigator.userAgent) || window.AndroidInterface || typeof Android !== 'undefined';
  
  try{
    // For WebView: open blob url in external browser
    const url = URL.createObjectURL(blob);
    if(isWebView){
      // Try Android interface or open in system browser
      window.open(url, '_blank');
      // Also try data url download for APK
      const reader = new FileReader();
      reader.onload = function(){
        try{
          const dataUrl = reader.result;
          // Create hidden link with data URL - works in WebView
          const a2 = document.createElement('a');
          a2.href = dataUrl;
          a2.download = filename;
          a2.target = '_blank';
          document.body.appendChild(a2);
          a2.click();
          setTimeout(()=>a2.remove(), 2000);
        }catch(e2){}
      };
      reader.readAsDataURL(blob);
      setTimeout(()=>URL.revokeObjectURL(url), 10000);
      return 'downloaded';
    } else {
      const a = document.createElement('a');
      a.href = url; a.download = filename; document.body.appendChild(a); a.click();
      setTimeout(()=>{ URL.revokeObjectURL(url); a.remove(); }, 4000);
      return 'downloaded';
    }
  }catch(e){
    // Final fallback: open as data url
    try{
      const reader = new FileReader();
      const dataUrl = await new Promise((res,rej)=>{ reader.onload=()=>res(reader.result); reader.onerror=rej; reader.readAsDataURL(blob); });
      window.location.href = dataUrl;
      return 'downloaded';
    }catch(e2){ alert('PDF তৈরি হয়েছে, কিন্তু ডাউনলোড ব্লক হয়েছে। Chrome ব্রাউজারে লিংক দিয়ে খুলুন।'); }
  }
  return 'downloaded';
}

          setProfilePhoto(reader.result);
        }
      };
      img.onerror = () => setProfilePhoto(reader.result);
      img.src = reader.result;
    };

    try{ e.target.value = ''; }catch(e){}

  // APK তে 100% কাজ করবে এমন Free Auth - Email + Password
  function handleEmailAuth(email, pass, isSignup){
    const e = (email||'').trim();
    if(!e || !pass){ setToast('Email ও Password দিন'); return; }
    if(pass.length < 6){ setToast('Password কমপক্ষে 6 অক্ষর'); return; }
    const auth = firebase.auth();
    const p = isSignup ? auth.createUserWithEmailAndPassword(e, pass) : auth.signInWithEmailAndPassword(e, pass);
    p.then(res=>{
      const u = {email: res.user.email, name: res.user.displayName || e.split('@')[0], photo: res.user.photoURL, uid: res.user.uid};
      setGoogleUser(u); saveLS('lifestyle_google_user', u);
      setToast(isSignup ? 'Account তৈরি হয়েছে' : 'Login সফল');
      syncFromCloud(u);
    }).catch(err=>{
      const code = err && err.code ? err.code : ''; const msg = err && err.message ? err.message : 'Login failed'; console.log('AUTH ERROR', code, msg);
      if(msg.includes('already') || msg.includes('email-already-in-use')) setToast('এই Email দিয়ে Account আছে। যদি Google দিয়ে খুলে থাকেন তাহলে নিচে Forgot Password এ ক্লিক করে নতুন Password সেট করুন');
      else if(msg.includes('not-found')) setToast('Account পাওয়া যায়নি, Sign Up করুন');
      else if(msg.includes('invalid-credential') || msg.includes('wrong-password')) setToast('Password ভুল অথবা এই Email Google দিয়ে খোলা। Forgot Password চেষ্টা করুন');
      else setToast(code + ' : ' + msg);
    });
  }
  function handleGoogleLogin(){
    try{
      const ua = navigator.userAgent || '';
      const isApkWebView = /wv|WebView|Android.*Version\//.test(ua) || !!window.Android || location.protocol === 'file:' || location.protocol === 'content:';
      // APK তেও চেষ্টা করবে, Block হলে নিচে Email Login আছে
      if(isApkWebView){
        setToast('Google Login চেষ্টা করছে...');
      }
      const provider = new firebase.auth.GoogleAuthProvider();
      provider.setCustomParameters({prompt: 'select_account'});
      if(location.protocol === 'file:' || /drive\.google\.com|docs\.google\.com/.test(document.referrer) || window.innerWidth < 600){
        firebase.auth().signInWithRedirect(provider);
      } else {
        firebase.auth().signInWithPopup(provider).then(res=>{

  function syncToCloud(user){
    if(!user || !user.uid) return;
    try{
      const db = firebase.firestore();
      const now = new Date().toISOString();
      const data = {transactions, peopleGiven, peopleTaken, bankLoans, userName, profilePhoto, updatedAt: now};
      db.collection('users').doc(user.uid).set(data, {merge:true});
      saveLS('lifestyle_last_sync', new Date(now).getTime());

      saveLS('lifestyle_last_sync_formatted', timeStr);
      setLastSyncTime(timeStr);
      setSyncStatus('Uploaded at ' + new Date(now).toLocaleTimeString());
      // Immediate local backup to prevent loss
      saveLS('lifestyle_transactions', transactions);
      saveLS('lifestyle_people_given', peopleGiven);
      saveLS('lifestyle_people_taken', peopleTaken);
      saveLS('lifestyle_bank_loans', bankLoans);
    }catch(e){ console.log('syncToCloud',e); }
  }
  function syncFromCloud(user){
    if(!user || !user.uid) return;
    try{
      const db = firebase.firestore();
      // Use realtime listener so both devices stay in sync
      db.collection('users').doc(user.uid).onSnapshot(doc=>{
        if(!doc.exists) { cloudLoadedRef.current = true; return; }
        const d = doc.data();
        if(!d) { cloudLoadedRef.current = true; return; }
        // Only auto-load on first load, or if cloud is newer than local
        if(!cloudLoadedRef.current){
          if(d.transactions) setTransactions(d.transactions);
          if(d.peopleGiven) setPeopleGiven(d.peopleGiven);
          if(d.peopleTaken) setPeopleTaken(d.peopleTaken);
          if(d.bankLoans) setBankLoans(d.bankLoans);
          if(d.userName) setUserName(d.userName);
          if(d.profilePhoto) setProfilePhoto(d.profilePhoto);
          cloudLoadedRef.current = true;
          console.log('Loaded from cloud');
          const tStr = d.updatedAt ? new Date(d.updatedAt).toLocaleTimeString() : new Date().toLocaleTimeString();
          setSyncStatus('Updated from other device ' + tStr);
          setCloudTimeStr(tStr);
          if(d.updatedAt) {
            const formatted = new Date(d.updatedAt).toLocaleString('en-US', {weekday:'long', year:'numeric', month:'long', day:'numeric', hour:'2-digit', minute:'2-digit', second:'2-digit'});
            setLastSyncTime(formatted);
            saveLS('lifestyle_last_sync_formatted', formatted);
          }
        } else {
          // If cloud updated from another device, merge if cloud has more data
          const cloudTime = d.updatedAt ? new Date(d.updatedAt).getTime() : 0;
          const lastSync = parseInt(localStorage.getItem('lifestyle_last_sync')||'0');
          if(cloudTime > lastSync + 5000){
            const tStr2 = d.updatedAt ? new Date(d.updatedAt).toLocaleTimeString() : new Date().toLocaleTimeString();
            setSyncStatus('Updated from other device ' + tStr2);
            setCloudTimeStr(tStr2);
            if(d.transactions && d.transactions.length >= transactions.length) setTransactions(d.transactions);
            if(d.peopleGiven && d.peopleGiven.length >= peopleGiven.length) setPeopleGiven(d.peopleGiven);
            if(d.peopleTaken && d.peopleTaken.length >= peopleTaken.length) setPeopleTaken(d.peopleTaken);
            if(d.bankLoans && d.bankLoans.length >= bankLoans.length) setBankLoans(d.bankLoans);
          }
        }
      });
    }catch(e){ console.log('syncFromCloud',e); }

    const getWeekRange = (offset=0)=>{
      const now = new Date();
      now.setDate(now.getDate() + offset*7);
      const day = now.getDay();
      const start = new Date(now); start.setDate(now.getDate() - day);
      const end = new Date(start); end.setDate(start.getDate()+6);
      const toStr = d=>d.toISOString().split('T')[0];
      return {start: toStr(start), end: toStr(end)};
    };
    const getMonthKey = (offset=0)=>{
      const d = new Date(); d.setMonth(d.getMonth()+offset);
      return d.toISOString().slice(0,7);
    };
    const getYearKey = (offset=0)=>{
      const d = new Date(); d.setFullYear(d.getFullYear()+offset);
      return String(d.getFullYear());
    };

    const lastWeek = getWeekRange(-1);

    const curYearKey = getYearKey(0);

            ),
            h('button', {onClick:()=>setPage('reports'), className:'flex flex-col items-center justify-center w-[64px] py-2'},
              h('span', {className:'text-[20px]'}, '\uD83D\uDCCA'),
              h('span', {className:'text-[10px] font-bold mt-1 ' + (page==='reports'?'text-[#2D2A26]':'text-[#8B7355]')}, t.reports)
            ),
            h('button', {onClick:()=>setPage('profile'), className:'flex flex-col items-center justify-center w-[64px] py-2'},
              h('span', {className:'text-[20px]'}, '\uD83D\uDC64'),
              h('span', {className:'text-[10px] font-bold mt-1 ' + (page==='profile'?'text-[#2D2A26]':'text-[#8B7355]')}, t.profile)
            )
          )
        )
      ),

      addSheetOpen ? h(BottomSheet, {title:t.addTransaction, onClose:()=>setAddSheetOpen(false)},
        h('div', {className:'grid grid-cols-1 gap-3'},
          h('button', {onClick:()=>{setAddType('income'); setAddSheetOpen(false);}, className:'w-full flex items-center gap-4 bg-[#E8F5E9] border border-[#C8E6C9] rounded-[20px] p-4 text-left'},
            h('span', {className:'text-[20px]'}, '\uD83D\uDCB0'), h('span', {className:'font-bold text-[15px] text-[#1B5E20]'}, t.addIncome)
          ),
          h('button', {onClick:()=>{setAddType('expense'); setAddSheetOpen(false);}, className:'w-full flex items-center gap-4 bg-[#FFEBEE] border border-[#FFCDD2] rounded-[20px] p-4 text-left'},
            h('span', {className:'text-[20px]'}, '\uD83D\uDCB8'), h('span', {className:'font-bold text-[15px] text-[#B71C1C]'}, t.addExpense)
          ),
          h('button', {onClick:()=>{setPage('given'); setAddSheetOpen(false);}, className:'w-full flex items-center gap-4 bg-[#FFF8E1] border border-[#FFE082] rounded-[20px] p-4 text-left'},
            h('span', {className:'text-[20px]'}, '\uD83E\uDD1D'), h('span', {className:'font-bold text-[15px] text-[#8B7355]'}, t.giveLoan)
          ),
          h('button', {onClick:()=>{setPage('taken'); setAddSheetOpen(false);}, className:'w-full flex items-center gap-4 bg-[#E3F2FD] border border-[#BBDEFB] rounded-[20px] p-4 text-left'},
            h('span', {className:'text-[20px]'}, '\uD83D\uDCE5'), h('span', {className:'font-bold text-[15px] text-[#1A4D8F]'}, t.takeLoan)
          ),
          h('button', {onClick:()=>{setAddType('bankLoan'); setAddSheetOpen(false);}, className:'w-full flex items-center gap-4 bg-[#2D2A26] rounded-[20px] p-4 text-left'},
            h('span', {className:'text-[20px]'}, '\uD83C\uDFE6'), h('span', {className:'font-bold text-[15px] text-white'}, t.bankLoan)
          )
        )
      ) : null,

      (addType === 'income' || addType === 'expense' || editingTx) ? h(BottomSheet, {
        title: editingTx ? t.editTransaction : (addType==='income'?t.addIncome:t.addExpense),
        onClose: ()=>{ setAddType(null); setEditingTx(null); }
      },
        h(TransactionForm, {
          t, lang, type: editingTx ? editingTx.type : addType, initial: editingTx, onSave: saveTransaction
        })
      ) : null,

      (addType === 'bankLoan' || editingBankLoan) ? h(BottomSheet, {
        title: editingBankLoan ? t.edit : t.bankLoan,
        onClose: ()=>{ setAddType(null); setEditingBankLoan(null); }
      },
        h(BankLoanForm, {t, lang, initial: editingBankLoan, onSave: saveBankLoan})
      ) : null,

      checklistLoanId ? (()=>{
        const loan = bankLoans.find(l=>l.id===checklistLoanId);
        if(!loan) return null;
        return h(BottomSheet, {title: loan.bankName + ' \u2022 ' + t.emiChecklist, onClose: ()=>setChecklistLoanId(null)},
          h(EmiChecklist, {t, lang, loan, onToggle:(i)=>toggleEmiPaid(loan.id, i)})
        );
      })() : null,

      h(ConfirmModal, {
        open: !!confirmDelTx, title: t.confirmDeleteTitle, message: t.confirmDeleteMsg,
        cancelLabel: t.cancel, confirmLabel: t.yesDelete,
        onCancel: ()=>setConfirmDelTx(null), onConfirm: ()=>deleteTransaction(confirmDelTx)
      }),
      h(ConfirmModal, {
        open: !!confirmDelBank, title: t.confirmDeleteTitle, message: t.confirmDeleteMsg,
        cancelLabel: t.cancel, confirmLabel: t.yesDelete,
        onCancel: ()=>setConfirmDelBank(null), onConfirm: ()=>deleteBankLoan(confirmDelBank)
      }),
      h(ConfirmModal, {
        open: confirmClearOpen, title: t.clearData, message: t.confirmDeleteMsg,
        cancelLabel: t.cancel, confirmLabel: t.yesDelete,
        onCancel: ()=>setConfirmClearOpen(false),
        onConfirm: ()=>{ localStorage.clear(); location.reload(); }
      })
    )
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(h(App));

</script>
</body></html>
